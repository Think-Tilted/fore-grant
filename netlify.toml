[build]
  command = "npm run build"
  publish = "dist"
  # Skip every push-triggered build (git push to any branch). This does NOT
  # affect build-hook-triggered builds — Netlify guarantees the `ignore`
  # command never cancels a build hook deploy, regardless of exit code.
  # See: https://docs.netlify.com/build/configure-builds/ignore-builds
  # Deploys only happen via `gh release create` (release-triggered build hook).
  ignore = "exit 0"


[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'"

